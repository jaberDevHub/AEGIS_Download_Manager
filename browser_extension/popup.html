<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Download Manager</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 18px;
      background: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .shield-icon {
      width: 22px;
      height: 22px;
      fill: #007AFF;
      flex-shrink: 0;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(148, 163, 184, 0.15);
      color: #94A3B8;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
    }
    .badge.disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
    }
    .status-text {
      color: #94A3B8;
      font-size: 12px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      background: #007AFF;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #0062CC;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748B;
      line-height: 1.35;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="shield-icon" viewBox="0 0 24 24">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.54-3.04 8.79-7 9.94-3.96-1.15-7-5.4-7-9.94V6.3l7-3.12z"/>
    </svg>
    <div class="title">Aegis Download Manager</div>
  </div>

  <div class="card">
    <div class="badge-row">
      <span>Desktop Bridge:</span>
      <span class="badge" id="badge">Connecting…</span>
    </div>
    <div class="status-text" id="status">Connecting to Aegis desktop application…</div>
  </div>

  <button class="btn" id="check" type="button">Check Connection</button>
  <div class="hint">Zero-setup unpacked extension. Just launch Aegis and start downloading.</div>

  <script src="popup.js"></script>
</body>
</html>
